<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>數位雨幕</title><meta name="description" content="黑底、綠色字元與無盡的數位雨幕。適合全螢幕播放。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='black'/%3E%3Cpath d='M10 5v16m6-12v18m6-24v14' stroke='%2300ed70' stroke-width='3' stroke-dasharray='3 2'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#daffe7;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}canvas{display:block;width:100%;height:100%;position:fixed;inset:0}body.idle{cursor:none}.controls{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 32px));border:1px solid #294333;background:#07110ded;backdrop-filter:blur(20px);border-radius:18px;padding:22px 24px;box-shadow:0 12px 70px #0009;transition:opacity .65s,translate .65s}.idle .controls{opacity:0;pointer-events:none;translate:0 14px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:19px;letter-spacing:4px;margin:0 0 6px;font-weight:500}.caption{font-size:13px;color:#8aa696;margin:0}.actions{display:flex;gap:8px}button{font:inherit;font-size:14px;color:#d4ffe4;border:1px solid #375642;background:#11291b;border-radius:9px;padding:10px 14px;cursor:pointer;white-space:nowrap}button.primary{color:#041809;background:#78ed9d;border-color:#78ed9d}button:hover{filter:brightness(1.2)}button:focus-visible,input:focus-visible{outline:2px solid #b0ffca;outline-offset:4px}.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin:23px 0 17px}label{font-size:14px;color:#b5d2c0;display:block}label span{display:flex;justify-content:space-between;margin-bottom:12px}output{color:#719b80;font:13px ui-monospace,monospace}input[type=range]{accent-color:#65e893;width:100%;margin:0;cursor:pointer;height:18px}.footer{border-top:1px solid #21372a;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#8aa696;font-size:12px}.footer label{font-size:13px;display:flex;align-items:center;gap:7px}.footer input{accent-color:#65e893}#status{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:12px 18px;border:1px solid #30533a;border-radius:10px;background:#09190e;color:#bfe6ce;font-size:14px;max-width:90%;text-align:center}#status:empty{display:none}kbd{font-family:inherit;color:#c2ddcb} @media(max-width:520px){.controls{bottom:16px;padding:19px}.top{align-items:flex-start}h1{font-size:17px}.caption{font-size:12px}.actions{gap:5px}button{padding:9px 10px;font-size:13px}.sliders{gap:16px}.footer{flex-wrap:wrap;line-height:1.8}}
.controls{max-height:calc(100dvh - 40px);overflow-y:auto}.characters{margin:0 0 18px}.characters label{margin-bottom:10px}.character-row{display:flex;gap:8px}.character-row input{min-width:0;flex:1;background:#020a05;color:#d4ffe4;border:1px solid #375642;border-radius:9px;padding:10px 12px;font:16px -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.character-help{margin:9px 0 0;color:#8aa696;font-size:13px;line-height:1.5}@media(max-width:520px){.character-row{flex-wrap:wrap}.character-row input{flex-basis:100%}}
</style></head><body>
<canvas id="rain" aria-label="在黑色背景上持續向下流動的綠色字元雨"></canvas>
<section class="controls" aria-label="雨幕設定"><div class="top"><div><h1>數位雨幕</h1><p class="caption">移動滑鼠喚出控制面板</p></div><div class="actions"><button id="pause" aria-label="暫停動畫">暫停</button><button class="primary" id="fullscreen">進入全螢幕</button></div></div>
<div class="sliders"><label><span>流動速度 <output id="speedValue">1.0×</output></span><input id="speed" aria-label="流動速度" type="range" min="0.3" max="2.5" step="0.1" value="1"></label><label><span>字元大小 <output id="sizeValue">20</output></span><input id="size" aria-label="字元大小" type="range" min="12" max="34" step="1" value="20"></label><label><span>亮度 <output id="brightnessValue">70%</output></span><input id="brightness" aria-label="亮度" type="range" min="20" max="100" step="1" value="70"></label></div>
<form class="characters" id="characterForm"><label for="characters">出現的字元</label><div class="character-row"><input id="characters" type="text" maxlength="512" autocomplete="off" spellcheck="false" aria-describedby="characterHelp" placeholder="例如：01、駭客任務、ABC123"><button type="submit">套用</button><button type="button" id="resetCharacters">還原預設</button></div><p class="character-help" id="characterHelp">從輸入的字元中隨機選取，不依句子順序排列；空白會忽略。</p></form>
<div class="footer"><span><kbd>F</kbd> 全螢幕 · <kbd>空白鍵</kbd> 暫停 · 閒置時自動隱藏</span><label><input type="checkbox" id="awake">保持螢幕開啟</label></div></section><div id="status" role="status"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('rain'),ctx=canvas.getContext('2d',{alpha:false});const defaultChars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン012345789<>+*=:ア';let chars=Array.from(defaultChars);let w=0,h=0,columns=[],last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,idleTimer,toastTimer,wake=null;const options={speed:1,size:20,brightness:70};const rand=(a,b)=>a+Math.random()*(b-a),glyph=()=>chars[Math.floor(Math.random()*chars.length)];
function seed(c,initial){c.head=initial?rand(-h*.5,h*1.2):-rand(0,h*.8);c.length=Math.floor(rand(9,38));c.speed=rand(45,140);c.alpha=rand(.25,1);c.glyphs=Array.from({length:65},glyph);c.nextMutation=0}
function resize(){w=innerWidth;h=innerHeight;const ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);columns=Array.from({length:Math.ceil(w/(options.size*1.05))},(_,i)=>{const c={x:i*options.size*1.05};seed(c,true);return c});draw(0,0)}
function draw(dt,t){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);ctx.font=`${options.size}px "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace`;ctx.textAlign='center';ctx.textBaseline='top';for(const c of columns){c.head+=dt*c.speed*options.speed;if(c.head-c.length*options.size>h)seed(c,false);if(t>c.nextMutation&&!paused){c.glyphs[Math.floor(Math.random()*c.glyphs.length)]=glyph();c.nextMutation=t+rand(65,250)}const headRow=Math.floor(c.head/options.size);for(let j=c.length;j>=0;j--){const y=(headRow-j)*options.size;if(y< -options.size||y>h)continue;const fade=Math.pow(1-j/(c.length+1),1.65)*c.alpha*options.brightness/100;ctx.globalAlpha=fade;ctx.fillStyle=j===0?'#d3ffe3':j<3?'#5bff95':'#00d953';ctx.fillText(c.glyphs[((headRow-j)%65+65)%65],c.x+options.size*.5,y)}}ctx.globalAlpha=1}
let frame=0;function tick(t){frame=requestAnimationFrame(tick);if(document.hidden){last=0;return}if(!last)last=t;if(t-last<1000/30)return;const dt=Math.min((t-last)/1000,.1);last=t;if(!paused)draw(dt,t)}requestAnimationFrame(tick);
function show(){document.body.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(!document.querySelector('.controls:focus-within'))document.body.classList.add('idle')},3500)}for(const e of ['pointermove','pointerdown','keydown'])document.addEventListener(e,show,{passive:true});document.querySelector('.controls').addEventListener('focusout',show);show();
function message(s){$('status').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('status').textContent='',5000)}function pause(){paused=!paused;updatePause()}function updatePause(){$('pause').textContent=paused?'繼續':'暫停';$('pause').setAttribute('aria-label',paused?'繼續動畫':'暫停動畫')}$('pause').onclick=pause;updatePause();
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();$('fullscreen').blur()}catch{message('請使用 Chrome 的「顯示方式 → 進入全螢幕」。')}}$('fullscreen').onclick=fullscreen;document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'離開全螢幕':'進入全螢幕';show()});document.addEventListener('keydown',e=>{if(e.target.matches('input,button')||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen()}if(e.code==='Space'){e.preventDefault();pause()}});
for(const name of ['speed','size','brightness']){$(name).addEventListener('input',()=>{options[name]=Number($(name).value);$(name+'Value').textContent=name==='speed'?options[name].toFixed(1)+'×':name==='brightness'?options[name]+'%':options[name];if(name==='size')resize();else if(paused)draw(0,0)})}
const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter('zh-Hant',{granularity:'grapheme'}):null;
function splitCharacters(value){const text=value.replace(/\s/gu,'');return segmenter?Array.from(segmenter.segment(text),item=>item.segment):Array.from(text)}
$('characters').value=defaultChars;
function applyCharacters(value){const next=splitCharacters(value);if(!next.length){$('characters').setCustomValidity('請輸入至少一個非空白字元。');$('characters').reportValidity();return false}chars=next;for(const c of columns)c.glyphs=Array.from({length:65},glyph);draw(0,0);return true}
$('characters').addEventListener('input',()=>$('characters').setCustomValidity(''));
$('characterForm').addEventListener('submit',e=>{e.preventDefault();if(applyCharacters($('characters').value)){document.activeElement.blur();show();message('已套用自訂字元')}});
$('resetCharacters').onclick=()=>{$('characters').value=defaultChars;$('characters').setCustomValidity('');applyCharacters(defaultChars);$('resetCharacters').blur();show();message('已還原預設字元')};
async function acquire(){if(!navigator.wakeLock){$('awake').checked=false;message('此環境無法保持螢幕開啟，請由 Mac 系統設定調整。');return}try{wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}catch{$('awake').checked=false;message('無法保持螢幕開啟，請檢查系統省電設定。')}}$('awake').onchange=async()=>{if($('awake').checked)await acquire();else if(wake)await wake.release()};document.addEventListener('visibilitychange',()=>{last=0;if(!document.hidden&&$('awake').checked)acquire()});addEventListener('resize',resize);resize();
})();
</script></body></html>
